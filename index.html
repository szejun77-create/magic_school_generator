<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔法学校随机生成器</title>
<style>
:root{color-scheme:light;--ink:#253b38;--muted:#68746e;--line:#dddcd1;--paper:#fffef8;--green:#214f46}*{box-sizing:border-box}body{margin:0;background:#efeee5;color:var(--ink);font:16px/1.65 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1080px;margin:48px auto;padding:0 28px}header{border-top:3px solid var(--green);padding:28px 0}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--muted)}h1{font:600 clamp(28px,5vw,44px)/1.3 Georgia,"Songti SC",serif;margin:12px 0}p{margin:8px 0;color:var(--muted)}.actions{display:flex;gap:12px;margin:22px 0;flex-wrap:wrap}button{font:inherit;border:1px solid var(--green);border-radius:6px;padding:11px 26px;cursor:pointer;background:var(--green);color:white}button+button{background:transparent;color:var(--green)}button:hover{filter:brightness(1.12)}button:focus-visible{outline:3px solid #b28b46;outline-offset:4px}button:disabled{opacity:.4;cursor:default}.meta{font-size:13px;color:var(--muted);min-height:22px}h2{font-size:19px;margin:30px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:20px 22px;background:var(--paper);border:1px solid var(--line);border-radius:8px}.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.name{font-size:14px;color:var(--muted)}.die{font:12px/1.5 ui-monospace,monospace;color:var(--green);white-space:nowrap}.value{font-size:19px;font-weight:600;margin:10px 0 6px}.desc{font-size:13px;color:var(--muted)}.special{border-top:3px solid #ab8b50}.empty{padding:40px;text-align:center;border:1px dashed #b9c2b8;border-radius:8px}footer{font-size:12px;color:var(--muted);margin:32px 0;border-top:1px solid var(--line);padding-top:16px}@media(max-width:650px){main{margin:20px auto;padding:0 16px}.grid{grid-template-columns:1fr}.card{padding:18px}.top{flex-wrap:wrap}}@media print{.actions{display:none}body{background:white}.card{break-inside:avoid}main{margin:0}}
</style>
<main><header><div class="eyebrow">WORLD BUILDING · 随机档案</div><h1>魔法学校随机生成器</h1><p>让骰子提供组合，故事由你决定。</p><div class="actions"><button id="generate" type="button">随机生成</button><button id="download" type="button" disabled>下载TXT</button></div><div id="meta" class="meta" role="status" aria-live="polite">尚未掷骰 · 点击「随机生成」建立一份学校档案</div></header>
<div id="results"><div class="empty">12 个常规维度 · 培养目标 D16 · 规模与课程<br><span class="desc">另作两次独立 D100 判定，01—05 或 96—100 触发特殊项。</span></div></div>
<footer>使用说明：各项独立生成，不修正矛盾，不评价优劣。默认面向魔法师；家庭财富不作贫富掷骰。<br>表格说明：依据原对话中可读取的设定补全；原助手表格未能读取，因此这里的具体分档与条目为补全版本，可在本文件的数据区修改。所有样式、脚本与数据均在本文件内，断网可用。</footer></main>
<script>
'use strict';
const DATA={"scales": [["学术水平", ["基础教学", "地区常规", "扎实进阶", "学术突出", "顶尖研究"], "从基础培养到前沿研究的教学与研究水平；不代表每名学生的表现。"], ["理论与应用", ["明显偏理论", "略偏理论", "理论应用并重", "略偏应用", "明显偏应用"], "指教学重心，不自动决定学术水平。"], ["纪律要求", ["宽松容忍", "较为宽松", "规章适中", "严格执行", "高度严整"], "指校规密度、执行强度与违规容忍度。"], ["学生自主权", ["安排由校方决定", "有限选择", "部分自行安排", "广泛自主", "高度自治"], "指学生对学习安排、组织与行动的决定空间。"], ["家世传统", ["新兴家庭为主", "较多近代家系", "新旧家系混合", "悠久家系较多", "古老家系集中"], "反映家系延续与传统积淀，不是贫富分级。"], ["竞争氛围", ["强调互助", "合作为主", "合作竞争并存", "竞争鲜明", "高度竞争"], "指日常比较、排名与资源争取的氛围。"], ["课外活动", ["很少组织", "少量活动", "活动适中", "活动丰富", "活动极为活跃"], "指社团、项目与校内外活动的活跃程度。"], ["人格塑造", ["几乎不作引导", "仅作基本引导", "有明确育人要求", "系统塑造品格", "强烈塑造人格"], "反映学校主动介入价值观与人格培养的程度，不评价其好坏。"], ["家世影响", ["基本不影响校内待遇", "影响较小", "存在非正式影响", "明显影响机会", "深度影响校内秩序"], "与家世传统独立：古老家系集中也可能受到平等对待。"], ["招生难度", ["门槛较宽", "较易录取", "中等选拔", "严格选拔", "极难录取"], "指获得录取资格的整体难度，不等同于学术高低。"]], "tables": [["招生方式", ["自主考试", "推荐入学", "学费准入", "考试＋推荐", "考试＋学费", "推荐＋学费", "考试＋推荐＋学费", "面试＋自主考试"], "学费准入表示付费及基本资格审核，不引入统考。"], ["治理结构", ["校长集中决策", "教师会议治理", "校董会治理", "出资家族治理", "校长与校董会共治", "教师与学生代表共治", "多家系联合治理", "创办者直接治理"], "仅描述决策权归属，不自动改变纪律与自主权。"], ["培养目标", ["延续魔法学术与知识", "探索新的魔法理论", "培养实操与施法专家", "培养法政与公共事务人才", "培养独立研究者", "培养地方事务管理者", "培养教育与传承者", "培养医疗与照护人才", "培养工程与建设人才", "培养文化、艺术与礼仪人才", "培养军务与防卫人才", "培养商业与组织管理人才", "培养具有公共责任的行动者", "培养家系与传统继承者", "发掘特殊天赋并发展个人方向", "提供广泛基础，让学生自行选择道路"], "目标描述学校希望培养怎样的人，不替学校或社会立场评分。"], ["学校规模", ["微型：约20—60人", "小型：约60—150人", "中小型：约150—350人", "中型：约350—700人", "大型：约700—1200人", "超大型：约1200—2000人"], "为全校在校人数的参考区间，非额外掷骰。"], ["课程组织", ["广泛基础课程", "基础课程＋方向选修", "若干专业分科", "单一领域深造", "导师制个人课表", "项目与实践为主"], "课程组织独立于培养目标、理论应用倾向。"]], "special": ["流动学校：随车队、船队或迁移路线授课", "多校区轮转：学生定期在不同教学点学习", "短期集中授课：集中教学与长期自修交替", "师徒小组制：以固定导师及小组为单位", "个别化课表：为每名学生配置不同进度", "跨年级混班：依能力与项目编组", "项目结业制：以完成项目代替固定年限毕业", "实践驻点制：长期在真实工作地点学习", "远距指导制：以通信与定期会面组织教学", "轮值自管制：师生轮流承担校务", "公开讲席制：围绕讲席自由组合学习", "双轨课程制：魔法课程与普通学科分轨，普通人可修部分课程"], "identities": ["军事学校：以军务与防卫体系为主要服务对象", "秘密研究学校：承担非公开研究与人才培养", "特殊天赋学校：面向罕见才能或明显偏科学生", "宫廷服务学校：培养宫廷所需的礼仪、文书与事务人员", "法政专门学校：培养法律、行政与公共事务人才", "混合招生学校：招收魔法师与非魔法师，按资格修课", "特定魔法专科学校：只围绕某类魔法领域培养人才", "封闭任务学校：为一项长期专门任务培养人员"]};
let current=null;
function roll(sides){const range=4294967296,limit=range-range%sides;let n;do{const a=new Uint32Array(1);crypto.getRandomValues(a);n=a[0]}while(n>=limit);return n%sides+1}
function record(name,sides,value,result,description){return {name,sides,value,result,description}}
function pick(name,entries,description){const v=roll(entries.length);return record(name,entries.length,v,entries[v-1],description)}
function pickSize(name, entries, description) {
  const v = roll(100);

  const i =
     v <= 5  ? 0 :
    v <= 20 ? 1 :
    v <= 50 ? 2 :
    v <= 80 ? 3 :
    v <= 95 ? 4 : 5;

  return record(
    name, 100, v, entries[i],
    description
  );
}
function gate(name,entries,tableName){const v=roll(100),active=v<=5||v>=96;const rows=[record(name,100,v,active?'触发特殊项':'未触发特殊项','触发区间：01—05、96—100；06—95 不触发。')];if(active)rows.push(pick(tableName,entries,'由本次独立特殊判定触发；表内每项均为有效特殊结果。'));return rows}
function create(){const regular=DATA.scales.map(([name,labels,desc])=>{const v=roll(100),i=Math.floor((v-1)/20);return record(name,100,v,labels[i],`命中区间 ${i*20+1}—${i*20+20}。${desc}`)});DATA.tables.slice(0,2).forEach(t=>regular.push(pick(...t)));const extra = DATA.tables.slice(2).map(
  t => t[0] === "学校规模"
    ? pickSize(...t)
    : pick(...t)
);return {time:new Date().toLocaleString('zh-CN',{hour12:false}),regular,extra,special:[...gate('特殊办学判定',DATA.special,'特殊办学'),...gate('特殊学校身份判定',DATA.identities,'特殊学校身份')]}}
function dice(r){return `D${r.sides} · 下限 1 / 上限 ${r.sides} · 出目 ${r.sides===100?String(r.value).padStart(2,'0'):r.value}`}
function card(r,special){const el=document.createElement('article');el.className='card'+(special?' special':'');const top=document.createElement('div');top.className='top';const name=document.createElement('span');name.className='name';name.textContent=r.name;const die=document.createElement('span');die.className='die';die.textContent=dice(r);top.append(name,die);const value=document.createElement('div');value.className='value';value.textContent=r.result;const desc=document.createElement('div');desc.className='desc';desc.textContent=r.description;el.append(top,value,desc);return el}
function render(){const root=document.getElementById('results');root.replaceChildren();for(const [title,rows,special] of [['01 / 常规维度',current.regular,false],['02 / 培养与教学',current.extra,false],['03 / 独立特殊判定',current.special,true]]){const h=document.createElement('h2');h.textContent=title;const grid=document.createElement('div');grid.className='grid';rows.forEach(r=>grid.append(card(r,special)));root.append(h,grid)}document.getElementById('meta').textContent=`生成于 ${current.time} · 共 ${current.regular.length+current.extra.length+current.special.length} 次掷骰 · 结果不作自动调整`;document.getElementById('download').disabled=false}
function toText(s){let lines=['魔法学校随机生成器','生成时间：'+s.time,'各项独立生成；不修正矛盾，不评价优劣。','具体表格为依据可读取设定补全的版本。',''];for(const [title,rows] of [['常规维度',s.regular],['培养与教学',s.extra],['独立特殊判定',s.special]]){lines.push('【'+title+'】');for(const r of rows)lines.push(r.name+'｜'+dice(r),'结果：'+r.result,'解释：'+r.description,'');}return lines.join('\r\n')}
document.getElementById('generate').addEventListener('click',()=>{current=create();render()});
document.getElementById('download').addEventListener('click',()=>{if(!current)return;const blob=new Blob(['\uFEFF',toText(current)],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='魔法学校档案_'+new Date().toISOString().replace(/[:.]/g,'-')+'.txt';a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});
</script></html>
